# .github/workflows/cd.yml
name: "🚀 CD — Build, Push & Deploy"

on:
  push:
    branches: [main]  # Solo deploy en main

# Solo un deploy a la vez
concurrency:
  group: deploy-production
  cancel-in-progress: false  # No cancelar deploys en curso

jobs:

  # ─────────────────────────────────────────────
  # JOB 1: Build y Push de imágenes Docker
  # ─────────────────────────────────────────────
  build-and-push:
    name: "📦 Build & Push Docker Images"
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write  # Necesario para push a ghcr.io

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🐳 Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Login en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏗️ Build & Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/marinm80/om_distribution-backend:latest
            ghcr.io/marinm80/om_distribution-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🏗️ Build & Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/marinm80/om_distribution-frontend:latest
            ghcr.io/marinm80/om_distribution-frontend:${{ github.sha }}
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────
  # JOB 2: Deploy al VPS
  # ─────────────────────────────────────────────
  deploy:
    name: "🚀 Deploy to VPS"
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production  # Opcional: protección con aprobación manual

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 📂 Copiar docker-compose.prod.yml al VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: "docker-compose.prod.yml"
          target: "~/apps/om_distribution"

      - name: 🚀 Deploy vía SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd ~/apps/om_distribution
            
            # Crear/actualizar el archivo .env con los secrets
            cat > .env << 'ENVEOF'
            MYSQL_DATABASE=${{ secrets.MYSQL_DATABASE }}
            MYSQL_USER=${{ secrets.MYSQL_USER }}
            MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}
            MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }}
            FRONTEND_URL=${{ secrets.FRONTEND_URL }}
            VITE_API_URL=${{ secrets.VITE_API_URL }}
            ENVEOF
            
            # Login en GitHub Container Registry
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u marinm80 --password-stdin
            
            # Pull de las nuevas imágenes y redeploy
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            
            # Limpiar imágenes antiguas
            docker image prune -f
            
            echo "✅ Deploy completado: $(date)"