# .github/workflows/ci.yml
name: "🔍 CI — Lint, Test & Build"

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Cancela ejecuciones anteriores del mismo PR/branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ─────────────────────────────────────────────
  # JOB 1: Lint y Tests del Backend
  # ─────────────────────────────────────────────
  backend:
    name: "⚙️ Backend — Lint & Test"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: 📦 Instalar dependencias
        run: npm ci

      - name: 🔨 Compilar TypeScript
        run: npm run build

      - name: 🧪 Ejecutar tests
        run: npm test
        env:
          NODE_ENV: test

  # ─────────────────────────────────────────────
  # JOB 2: Lint y Build del Frontend
  # ─────────────────────────────────────────────
  frontend:
    name: "🎨 Frontend — Lint & Build"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Instalar dependencias
        run: npm ci --legacy-peer-deps

      - name: 🔍 Ejecutar ESLint
        run: npm run lint

      - name: 🔨 Build de producción
        run: npm run build
        env:
          VITE_API_URL: https://api.placeholder.com  # Solo para validar el build

  # ─────────────────────────────────────────────
  # JOB 3: Build de imágenes Docker (valida que compilan)
  # ─────────────────────────────────────────────
  docker-build:
    name: "🐳 Docker — Validar Build"
    runs-on: ubuntu-latest
    needs: [backend, frontend]  # Solo si lint+tests pasan

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🐳 Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔨 Build Backend Image (sin push)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🔨 Build Frontend Image (sin push)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          build-args: |
            VITE_API_URL=https://api.placeholder.com
          cache-from: type=gha
          cache-to: type=gha,mode=max