services:

  # 1.5 BASE DE DATOS (MySQL 8) - New DB
  om-mysql-db:
    image: mysql:8.0
    container_name: om-distribution-mysql-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-om_markets}
      MYSQL_USER: ${MYSQL_USER:-mysqluser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-rootpass}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
    volumes:
      - mysql_data:/var/lib/mysql
      # Use a specific init folder for MySQL
      - ./backend/database/mysql-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "3306:3306"
    networks:
      - om_internal_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 2. BACKEND (Express.js)
  om-backend:
    build:
      context: ./backend
    container_name: om-distribution-backend
    restart: unless-stopped
    depends_on:
      om-mysql-db:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-mysqluser}:${MYSQL_PASSWORD:-rootpass}@om-mysql-db:3306/${MYSQL_DATABASE:-om_markets}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      PORT: 5000
      NODE_ENV: production
    volumes:
      - uploads_data:/app/public/uploads
    networks:
      - coolify
      - om_internal_net

  # 3. FRONTEND (React + Vite)
  om-frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: om-distribution-frontend
    restart: unless-stopped
    depends_on:
      - om-backend
    networks:
      - coolify

networks:
  om_internal_net:
    driver: bridge

volumes:

  mysql_data:
  uploads_data:
